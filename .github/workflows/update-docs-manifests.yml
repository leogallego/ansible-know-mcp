name: Update docs manifests

on:
  schedule:
    - cron: '23 4 * * 1'  # Weekly on Monday at 04:23 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -e ".[dev,build]"

      - name: Build manifests
        run: python scripts/build_docs_manifests.py

      - name: Check for changes
        id: changes
        run: |
          if git diff -I '"generated":' --quiet src/ansible_know/data/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="auto/update-docs-manifests"
          git fetch origin "$branch" 2>/dev/null || true
          git checkout -B "$branch"
          git add src/ansible_know/data/
          git commit -m "chore: update docs manifests"
          git push --force-with-lease origin "$branch"
          pr_number=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')
          if [ -n "$pr_number" ]; then
            echo "PR #$pr_number already exists, force-pushed update."
          else
            pr_number=$(gh pr create \
              --head "$branch" \
              --title "chore: update docs manifests" \
              --body "$(cat <<'EOF'
          Automated weekly rebuild of documentation manifests from
          docs.ansible.com (objects.inv + sitemap + markdown endpoint).

          Auto-merges when CI passes.
          EOF
          )" | grep -oE '[0-9]+$')
            echo "Created PR #$pr_number."
          fi
          gh pr merge "$pr_number" --squash --auto
