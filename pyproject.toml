[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ansible-know-mcp"
version = "0.3.2"
description = "Ansible Knowledge MCP Server — module and role discovery, documentation, and skill generation for AI agents"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
readme = "README.md"
keywords = ["ansible", "mcp", "ai", "agent", "skills", "module-discovery"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
]
authors = [
    { name = "Leonardo Gallego", email = "leo.pypi@gallego.red" },
]
dependencies = [
    "fastmcp>=3.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/leogallego/ansible-know-mcp"
Repository = "https://github.com/leogallego/ansible-know-mcp"
Issues = "https://github.com/leogallego/ansible-know-mcp/issues"

[project.scripts]
ansible-know-mcp = "ansible_know.server:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23", "pytest-cov>=4.0", "ruff>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/ansible_know"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: opt-in tests that hit real ansible-doc or Galaxy API (deselect with '-m not integration')",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "A", "C4", "T20"]

[tool.coverage.run]
source = ["ansible_know"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["if __name__", "pragma: no cover"]
